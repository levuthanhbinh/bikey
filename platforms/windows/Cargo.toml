[package]
name = "bikey-tsf"
description = "bikey Text Services Framework (TSF) text service for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "bikey"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
bikey-core = { path = "../../crates/bikey-core" }
windows-core = "=0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
]

[features]
# Development only: print internal events to stderr. Never enable for
# release builds (the shipped DLL must not log anything).
trace = []

[lints]
workspace = true
