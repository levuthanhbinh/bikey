# Builds the Windows installer on every push to main, so packaging problems show
# up before a release. A v* tag also publishes a GitHub Release.
#
# Code signing runs through SignPath once the repository variable
# SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set (see
# RELEASING.md). Until then, tagged releases are published unsigned.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read # SignPath downloads the unsigned artifacts
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache here: release binaries are always built from scratch.

      - name: Read the version
        id: version
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $release = $env:IS_TAG -eq 'true'
          if ($release) {
            if ($env:TAG -ne "v$version") { throw "tag $env:TAG does not match version $version in Cargo.toml" }
            if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) {
              throw "CHANGELOG.md has no section for $version"
            }
          }
          $sign = $release -and [bool]$env:SIGNPATH_ORG
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "sign=$($sign.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "bikey $version, release: $release, code signing: $sign"

      - run: rustup target add i686-pc-windows-msvc
      - run: cargo test --workspace --locked

      - name: Build the DLLs
        run: |
          cargo build --release --locked -p bikey-tsf
          if ($LASTEXITCODE) { exit 1 }
          cargo build --release --locked -p bikey-tsf --target i686-pc-windows-msvc
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory dist\dlls\x64, dist\dlls\x86 | Out-Null
          Copy-Item target\release\bikey.dll dist\dlls\x64\
          Copy-Item target\i686-pc-windows-msvc\release\bikey.dll dist\dlls\x86\
          Get-ChildItem dist\dlls -Recurse -File | ForEach-Object {
            "$($_.FullName): $($_.VersionInfo.ProductName) $($_.VersionInfo.ProductVersion)"
          }

      - name: Upload the unsigned DLLs for signing
        id: unsigned-dlls
        if: steps.version.outputs.sign == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-dlls
          path: dist/dlls
          if-no-files-found: error

      - name: Sign the DLLs (SignPath)
        if: steps.version.outputs.sign == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'bikey' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: dlls
          github-artifact-id: ${{ steps.unsigned-dlls.outputs.artifact-id }}
          wait-for-completion: true
          # Every request waits for a person to approve it.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-dlls

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { exit 1 }
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' |
            Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          "Inno Setup $($iscc.VersionInfo.ProductVersion): $($iscc.FullName)"
          "INNO_ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build the installer
        env:
          SIGN: ${{ steps.version.outputs.sign }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $dlls = if ($env:SIGN -eq 'true') { 'dist\signed-dlls' } else { 'dist\dlls' }
          ./scripts/build-installer.ps1 -NoBuild -DllDir $dlls
          # A fixed name keeps the SignPath artifact configuration simple.
          New-Item -ItemType Directory dist\installer | Out-Null
          Copy-Item "target\installer\bikey-setup-$env:VERSION.exe" dist\installer\bikey-setup.exe

      - name: Upload the unsigned installer for signing
        id: unsigned-installer
        if: steps.version.outputs.sign == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: dist/installer
          if-no-files-found: error

      - name: Sign the installer (SignPath)
        if: steps.version.outputs.sign == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'bikey' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-installer

      - name: Collect the release files
        env:
          SIGN: ${{ steps.version.outputs.sign }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $signed = $env:SIGN -eq 'true'
          $dir = if ($signed) { 'dist\signed-installer' } else { 'dist\installer' }
          $name = "bikey-setup-$env:VERSION.exe"
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "$dir\bikey-setup.exe" "release\$name"

          if ($signed) {
            foreach ($file in "release\$name", 'dist\signed-dlls\x64\bikey.dll', 'dist\signed-dlls\x86\bikey.dll') {
              $sig = Get-AuthenticodeSignature $file
              if ($sig.Status -ne 'Valid') { throw "$file is not validly signed: $($sig.Status)" }
              "$file signed by $($sig.SignerCertificate.Subject)"
            }
          }

          $hash = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", "$hash  $name`n")
          Get-Content release\SHA256SUMS.txt

          # Release notes: this version's CHANGELOG.md section.
          $lines = Get-Content CHANGELOG.md
          $hit = Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($env:VERSION))\]" |
            Select-Object -First 1
          $body = @()
          if ($hit) {
            $body = foreach ($line in $lines[$hit.LineNumber..($lines.Count - 1)]) {
              if ($line -match '^## \[|^\[[^\]]+\]: ') { break }
              $line
            }
          }
          $notes = @()
          if (-not $signed) {
            $notes += '> **This build is not code-signed yet**, so Windows SmartScreen may warn',
              '> before it runs. To check your download, compare its SHA-256 with',
              '> `SHA256SUMS.txt`, or run `gh attestation verify <file> --repo levuthanhbinh/bikey`.',
              ''
          }
          $notes += $body
          ($notes -join "`n").Trim() + "`n" | Set-Content -Encoding utf8NoBOM -NoNewline dist\notes.md

      - name: Attest build provenance
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/bikey-setup-*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            dist/notes.md
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -R out
          gh release create "$TAG" out/release/bikey-setup-*.exe out/release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "bikey $VERSION" --notes-file out/dist/notes.md
