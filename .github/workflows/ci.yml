name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml, so the pinned toolchain is installed automatically.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: C API smoke test (header matches the Rust exports)
        if: runner.os != 'Windows'
        run: |
          cargo build -p bikey-ffi --locked
          cc -std=c11 -Wall -Wextra -Werror -Icrates/bikey-ffi/include \
            crates/bikey-ffi/tests/c/smoke.c target/debug/libbikey_ffi.a \
            -lpthread -ldl -lm -o smoke
          ./smoke

  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the engine for 5 minutes
        working-directory: fuzz
        run: cargo +"$NIGHTLY" fuzz run engine -- -max_total_time=300

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
